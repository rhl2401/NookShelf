services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assetmgmt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-assetmgmt}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assetmgmt}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${APP_IMAGE:-ghcr.io/rhl2401/nookshelf:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # docker-entrypoint.sh builds DATABASE_URL from these, URL-encoding the
      # user/password — safe even if POSTGRES_PASSWORD contains characters
      # like '/', '@', or '+' that would otherwise break a raw connection
      # string (see docker-entrypoint.sh for why).
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-assetmgmt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-assetmgmt}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      # Required (set to "true") if you're running behind your own reverse
      # proxy (nginx, Caddy, Traefik, etc.) — otherwise Auth.js rejects every
      # request with "UntrustedHost", since it only auto-trusts the host on
      # Vercel/Cloudflare Pages. Safe because it's your own proxy controlling
      # the Host header, not the public internet directly. Leave unset/false
      # if the app is exposed directly with no reverse proxy in front of it.
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-false}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      AUTH_MICROSOFT_ENTRA_ID_ID: ${AUTH_MICROSOFT_ENTRA_ID_ID}
      AUTH_MICROSOFT_ENTRA_ID_SECRET: ${AUTH_MICROSOFT_ENTRA_ID_SECRET}
      AUTH_MICROSOFT_ENTRA_ID_ISSUER: ${AUTH_MICROSOFT_ENTRA_ID_ISSUER}
      AUTH_GENERIC_OIDC_ID: ${AUTH_GENERIC_OIDC_ID}
      AUTH_GENERIC_OIDC_SECRET: ${AUTH_GENERIC_OIDC_SECRET}
      AUTH_GENERIC_OIDC_ISSUER: ${AUTH_GENERIC_OIDC_ISSUER}
      AUTH_GENERIC_OIDC_NAME: ${AUTH_GENERIC_OIDC_NAME:-Single Sign-On}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      UPLOADS_DIR: /app/uploads
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_PREFIX: ${S3_PREFIX}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-EUR}
    # Delete this if you're running a reverse proxy (nginx, Caddy, Traefik,
    # etc.) on the same Docker network as this container — point the proxy at
    # `app:3000` directly instead. Nothing outside that network can reach the
    # app at all then, which is strictly more locked-down than publishing the
    # port and relying on the proxy alone. See README § Running behind a
    # reverse proxy.
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/app/uploads

volumes:
  db_data:
  uploads:
